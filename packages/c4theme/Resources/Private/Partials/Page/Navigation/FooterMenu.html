<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:spaceless>
	<f:if condition="{footermenu}">
		<ul class="footer-nav">
			<f:for each="{footermenu}" as="menu" iteration="itFooter">
				<li id="n_{menu.data.uid}" class="{f:if(condition:menu.active,then:'current')}"><a href="{menu.link}"
						title="{menu.title}"><span class="item-title">{menu.title}</span></a></li>
			</f:for>
		</ul>
	</f:if>
</f:spaceless>

</html>
