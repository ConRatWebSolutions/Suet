<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
 
<f:spaceless>
	<f:if condition="{fsubmenu}"> 
		<ul>
		    <f:for each="{fsubmenu}" as="menux" iteration="ivtfooter">
		        <li>
		            <a href="{menux.link}" title="{menux.title}" class="{f:if(condition:'{menux.active}',then:'active')}"><span class="item-title">{menux.title}</span></a>
		        </li>		        
		    </f:for>
		</ul>
	</f:if> 
</f:spaceless>
</html>
