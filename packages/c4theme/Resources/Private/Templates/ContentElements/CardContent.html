<html data-namespace-typo3-fluid="true"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">

     
<div class="col-md-{data.groesse} col-sm-6">
        <!--Image Card-->
        <div class="card hoverable bglila">
            <div class="card-image">
                <div class="view overlay hm-white-slight z-depth-1">
                  <f:link.typolink parameter="{data.link}">
                        <f:if condition="{previewImage}">
                            <f:image image="{previewImage.0}"  alt="{data.header}"/>
                        </f:if>
                    </f:link.typolink>
                        <div class="mask waves-effect"></div>
                   
                </div>
            </div>
            <div class="card-content">
               <f:link.typolink parameter="{data.link}"> <h5>{data.header}</h5></f:link.typolink>
                <p>{data.bodytext}</p>
            </div>
            
      <f:if condition="{data.linktext}!=''">       
            <!--Buttons-->
            <div class="card-btn">
              
                	<f:link.typolink parameter="{data.link}" class="linkboxed">{data.linktext}</f:link.typolink>
                	
                	  
            </div>
            <!--/.Buttons-->
     </f:if>      
        </div>
        <!--Image Card-->
</div>
</html>
