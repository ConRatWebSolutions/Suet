<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:bk2k="http://typo3.org/ns/BK2K/BootstrapPackage/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Header" />
<f:section name="Main">

 
    <f:if condition="{frame_class} == 'teaser-1'">
        <f:then>
            
        <article class="teaser teaser-{data.tx_crtemplates_teasertype}" id="aktuelles">
	
            <f:if condition="{data.header}">
                <header class="teaser__header title_h1">
                    <h1>{data.header}</h1>
                </header>
            </f:if>
        
            <div class="teaser__content">
                <f:if condition="{images.0}">
                    <div class="teaser__image">
                        <figure class="teaser__image-inner" style="background-image: url({f:uri.image(image:images.0)});">
                            <f:image image="{images.0}"/>
                        </figure>
                    </div>
                </f:if>
        
                <div class="teaser__content-inner">
                    <f:format.html>{data.bodytext}</f:format.html>
                    <f:if condition="{data.header_link}">
                        <f:link.typolink parameter="{data.header_link}" class="link"><f:translate key="readmore" extensionName="cr_templates"/></f:link.typolink>
                    </f:if>
                </div>
        
            </div>
        
        </article>

        
       </f:then>
       <f:else>
            <f:variable name="imageConfig">{settings.responsiveimages.contentelements.textpic.right}</f:variable>
            <bk2k:data.imageVariants as="variants" variants="{variants}" multiplier="{imageConfig.multiplier}" gutters="{imageConfig.gutters}" corrections="{imageConfig.corrections}" />
            <div class="textpic textpic-right">
                <div class="textpic-item textpic-gallery">
                    <f:render partial="Media/Gallery" arguments="{_all}" />
                </div>
                <div class="textpic-item textpic-text">
                    <f:render partial="Header/All" arguments="{_all}" />
                    <f:format.html>{data.bodytext}</f:format.html>
                </div>
            </div>
        </f:else>
 </f:if>
</f:section>
</html>
